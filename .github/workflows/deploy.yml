name: Deploy Fleet Maintenance Platform

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  AWS_REGION: us-east-1
  ECR_BACKEND: fleet-backend
  ECR_BFF: fleet-bff
  ECS_CLUSTER: fleet-maintenance-cluster
  ECS_BACKEND_SERVICE: fleet-backend-service
  ECS_BFF_SERVICE: fleet-bff-service
  ECS_BACKEND_TASK: fleet-backend-task
  ECS_BFF_TASK: fleet-bff-task

jobs:
  # ============================================
  # JOB 1: Build Backend (Angular embedded)
  # ============================================
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Build Angular
        working-directory: ./frontend
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Embed Angular into Backend
        run: |
          mkdir -p src/main/resources/static
          if [ -d frontend/dist/fleet-maintenance-frontend/browser ]; then
            cp -r frontend/dist/fleet-maintenance-frontend/browser/* src/main/resources/static/
          else
            cp -r frontend/dist/fleet-maintenance-frontend/* src/main/resources/static/
          fi

      - name: List static directory contents
        run: |
          ls -l src/main/resources/static

      - name: Build Spring Boot JAR
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar

  # ============================================
  # JOB 2: Build & Push Backend to ECR
  # ============================================
  push-backend-ecr:
    needs: build-backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push Backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_BACKEND:$IMAGE_TAG $ECR_REGISTRY/$ECR_BACKEND:latest
          docker push $ECR_REGISTRY/$ECR_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND:latest

  # ============================================
  # JOB 3: Deploy Backend to ECS
  # ============================================
  deploy-backend-ecs:
    needs: push-backend-ecr
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_BACKEND_TASK }} \
            --query taskDefinition \
            --output json > task-definition.json
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt,
            .enableFaultInjection
          )' task-definition.json > clean-task-definition.json

      - name: Render task definition
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: clean-task-definition.json
          container-name: fleet-backend
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BACKEND }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          service: ${{ env.ECS_BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ============================================
  # JOB 4: Build & Push BFF to ECR
  # ============================================
  build-bff:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './bff/package-lock.json'

      - name: Install & Build BFF
        working-directory: ./bff
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr-bff
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push BFF
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-bff.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BFF:$IMAGE_TAG ./bff
          docker tag $ECR_REGISTRY/$ECR_BFF:$IMAGE_TAG $ECR_REGISTRY/$ECR_BFF:latest
          docker push $ECR_REGISTRY/$ECR_BFF:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BFF:latest

  # ============================================
  # JOB 5: Deploy BFF to ECS
  # ============================================
  deploy-bff-ecs:
    needs: build-bff
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_BFF_TASK }} \
            --query taskDefinition \
            --output json > task-definition.json
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt,
            .enableFaultInjection
          )' task-definition.json > clean-task-definition.json

      - name: Render task definition
        id: render-bff
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: clean-task-definition.json
          container-name: fleet-bff
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BFF }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-bff.outputs.task-definition }}
          service: ${{ env.ECS_BFF_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
